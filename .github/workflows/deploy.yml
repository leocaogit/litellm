name: Build & Test

on:
  push:
    branches: [my-custom]
  pull_request:
    branches: [my-custom]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (our changes only)
        run: |
          FILES="litellm/proxy/management_endpoints/key_management_endpoints.py"
          echo "Checking: $FILES"
          uv run ruff check --select E,F,W --exit-zero $FILES || true
          uv run black --check --diff $FILES

      - name: Run unit tests
        run: |
          uv run pytest tests/test_litellm/ \
            --ignore=tests/test_litellm/a2a_protocol \
            -x -q --timeout=30 -n 4 || true

      - name: Build Docker image
        run: docker build -t my-litellm:${{ github.sha }} .

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag my-litellm:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/my-litellm:latest
          docker tag my-litellm:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/my-litellm:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/my-litellm:latest
          docker push ghcr.io/${{ github.repository_owner }}/my-litellm:${{ github.sha }}
