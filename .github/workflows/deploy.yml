name: Build & Test

on:
  push:
    branches: [my-custom]
  pull_request:
    branches: [my-custom]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (changed files only)
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.py')
          if [ -n "$CHANGED" ]; then
            echo "Checking: $CHANGED"
            echo "$CHANGED" | xargs uv run ruff check --select E,F,W
            echo "$CHANGED" | xargs uv run black --check
          else
            echo "No Python files changed, skipping lint"
          fi

      - name: Run unit tests
        run: uv run pytest tests/test_litellm/ -x -q --timeout=30 -n 4

      - name: Build Docker image
        run: docker build -t my-litellm:${{ github.sha }} .

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag my-litellm:${{ github.sha }} ghcr.io/leocaogit/my-litellm:latest
          docker tag my-litellm:${{ github.sha }} ghcr.io/leocaogit/my-litellm:${{ github.sha }}
          docker push ghcr.io/leocaogit/my-litellm:latest
          docker push ghcr.io/leocaogit/my-litellm:${{ github.sha }}
